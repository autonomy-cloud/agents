[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openagents-plugin-silero"
dynamic = ["version"]
description = "Agent Framework Plugin for Silero"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10.0"
authors = [{ name = "OpenAgents contributors" }]
keywords = ["voice", "ai", "realtime", "audio", "video", "webrtc"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "openagents-core>=1.6.9",
    "onnxruntime>=1.18",
    "numpy>=1.26",
]

[project.urls]
Source = "https://github.com/autonomy-cloud/agents"

[tool.hatch.version]
path = "openagents/plugins/silero/version.py"

[tool.hatch.build.targets.wheel]
packages = ["openagents"]

[tool.hatch.build.targets.sdist]
include = ["/openagents"]

[tool.hatch.build.targets.wheel.shared-data]
"openagents/plugins/silero/resources/silero_vad.onnx" = "openagents/plugins/silero/resources/silero_vad.onnx"

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { openagents-core = "0 days" }
