# Local dev stack for the auxiliary coworker services (workstation, and
# eventually the coworker agent) — NOT openagents-server itself.
#
# openagents-server runs natively (see scripts/dev-up.sh), not in this
# compose file: a single "--dev" instance needs to advertise one
# --node-ip that's reachable by both the host browser (openagents-console)
# and any sibling containers, and those are two different addresses when
# the server itself is containerized (127.0.0.1 after port-publishing vs.
# a Docker-internal address). Running it natively sidesteps that split
# entirely — host clients reach it at 127.0.0.1, and containers already
# reach a host-run server at host.docker.internal (verified working).
#
# Usage: ./scripts/dev-up.sh (starts the server, then this compose stack)
#        or `docker compose up` directly once the server is already running.

services:
  workstation:
    build:
      context: ./runtime/components/openagents-workstation
    environment:
      OPENAGENTS_URL: ${OPENAGENTS_URL:-ws://host.docker.internal:7880}
      OPENAGENTS_API_KEY: ${OPENAGENTS_API_KEY:-devkey}
      OPENAGENTS_API_SECRET: ${OPENAGENTS_API_SECRET:-secret}
      ROOM_NAME: ${ROOM_NAME:-coworker-standup}
      # Distinct from openagents-coworker's default identity (anika-coworker)
      # so they don't collide over the same LiveKit participant slot — see
      # cmd/openagents-workstation/main.go's loadConfig() comment.
      COWORKER_IDENTITY: ${COWORKER_IDENTITY:-anika-coworker-desktop}
    extra_hosts:
      # host.docker.internal is automatic on Docker Desktop (macOS/Windows);
      # this makes it resolve on Linux Docker too.
      - "host.docker.internal:host-gateway"
    networks:
      - default
    restart: unless-stopped

  # Teams-meeting join bridge (openagents-teams-bridge) — a coworker joins an
  # external Microsoft Teams meeting by URL. Ported from autonomy-cloud/cast's
  # cast-meeting (itself a fork of attendee-labs/attendee, ELv2-licensed —
  # see runtime/components/openagents-teams-bridge/ABSORBED.md) with the
  # LiveKit target repointed at openagents-server. Three services, matching
  # cast's own local dev profile: a dedicated Postgres, the API app, and a
  # Celery worker that actually runs the Selenium/Chrome bot when a join is
  # requested (LAUNCH_BOT_METHOD defaults to "celery" — in-process, no nested
  # container spawn, so this worker's image itself carries Chrome/Xvfb).
  teams-bridge-db:
    profiles: [teams]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: teams_bridge
      POSTGRES_USER: teams_bridge
      POSTGRES_PASSWORD: ${TEAMS_BRIDGE_DB_PASSWORD:-local-teams-bridge-development}
    volumes: [teams-bridge-db-data:/var/lib/postgresql/data]
    networks: [default]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U teams_bridge -d teams_bridge"]
      interval: 5s
      timeout: 5s
      retries: 20

  teams-bridge-redis:
    profiles: [teams]
    image: redis:7-alpine
    networks: [default]

  teams-bridge:
    profiles: [teams]
    build:
      context: ./runtime/components/openagents-teams-bridge/runtime
    ports:
      # Published (unlike cast's own internal-only deployment) so
      # openagents-console, which runs natively via `next dev`, can reach
      # this API from the host. Not part of the ELv2-licensed upstream —
      # a local-dev-only choice made here.
      - "127.0.0.1:7000:7000"
    environment: &teams-bridge-environment
      DJANGO_SETTINGS_MODULE: cast_runtime.settings
      # Generated once (not hardcoded) by scripts/dev-up.sh into
      # .env.teams-bridge (gitignored) — see that script.
      DJANGO_SECRET_KEY: ${TEAMS_BRIDGE_DJANGO_SECRET_KEY:?generated by scripts/dev-up.sh}
      CREDENTIALS_ENCRYPTION_KEY: ${TEAMS_BRIDGE_ENCRYPTION_KEY:?generated by scripts/dev-up.sh}
      TEAMS_BRIDGE_API_TOKEN: ${TEAMS_BRIDGE_API_TOKEN:?generated by scripts/dev-up.sh}
      POSTGRES_HOST: teams-bridge-db
      POSTGRES_DB: teams_bridge
      POSTGRES_USER: teams_bridge
      POSTGRES_PASSWORD: ${TEAMS_BRIDGE_DB_PASSWORD:-local-teams-bridge-development}
      POSTGRES_SSL_REQUIRE: "false"
      DJANGO_SSL_REQUIRE: "false"
      ALLOWED_HOSTS: teams-bridge,localhost,127.0.0.1
      REDIS_URL: redis://teams-bridge-redis:6379/0
      LIVEKIT_URL: ${OPENAGENTS_URL:-ws://host.docker.internal:7880}
      LIVEKIT_API_KEY: ${OPENAGENTS_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${OPENAGENTS_API_SECRET:-secret}
      ENABLE_CHROME_SANDBOX: "false"
    entrypoint: [/bin/sh, -ec]
    command:
      - python manage.py migrate --noinput && python -m cast_runtime.bootstrap && gunicorn attendee.wsgi:application --bind 0.0.0.0:7000 --workers 2 --timeout 60
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [default]
    depends_on:
      teams-bridge-db: { condition: service_healthy }
      teams-bridge-redis: { condition: service_started }
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:7000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 30

  teams-bridge-worker:
    profiles: [teams]
    build:
      context: ./runtime/components/openagents-teams-bridge/runtime
    environment: *teams-bridge-environment
    command: [celery, -A, attendee, worker, --loglevel=INFO, --concurrency=1]
    shm_size: 2gb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [default]
    depends_on:
      teams-bridge: { condition: service_healthy }

networks:
  # Docker Desktop's host.docker.internal now resolves to an IPv6-only
  # internal proxy address; without IPv6 enabled on this network the
  # container has no route to it at all ("network is unreachable"), which
  # blocks the one address Docker Desktop reliably forwards to the host for
  # any port (used as a TURN-relay fallback for WebRTC — see
  # openagents-server's --turn.extra_advertised_host).
  default:
    enable_ipv6: true

volumes:
  teams-bridge-db-data:

# openagents-coworker (runtime/components/openagents-coworker) is a plain
# Python component with no system-package dependencies (unlike
# workstation's Xvnc/xdotool/ffmpeg) — it runs natively via `uv run`, not
# in this compose file. See scripts/dev-up.sh, which starts it alongside
# the server and this compose stack.
