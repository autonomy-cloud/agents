[tool.uv]
constraint-dependencies = ['onnxruntime<1.24; python_version < "3.11"']
default-groups = ["dev"]

[tool.uv.sources]
openagents-core = { workspace = true }
openagents-plugin-openai = { workspace = true }
openagents-plugin-silero = { workspace = true }
openagents-rtc = { workspace = true }
openagents-api = { workspace = true }
openagents-protocol = { workspace = true }
openagents-blingfire = { path = "runtime/vendor/python/wheels/openagents_blingfire-1.1.0-cp312-cp312-macosx_11_0_arm64.whl" }

[tool.uv.workspace]
members = [
    "openagents-core",
    "openagents-plugins/openai",
    "openagents-plugins/silero",
    "runtime/python",
    "runtime/components/openagents-python-sdks/openagents-api",
    "runtime/components/openagents-python-sdks/openagents-protocol",
    "runtime/components/openagents-python-sdks/openagents-rtc",
]

[dependency-groups]
dev = [
    "python-dotenv>=1.0.1",
    "mypy",
    "pytest>=9.0.3,<9.1",
    "ruff",
    "pytest-asyncio>=0.25.3",
    "pytest-asyncio-concurrent==0.5.2",
    "pytest-xdist>=3.8.0",
    "requests>=2.32",
    "jiwer>=4",
    "mcp>=1.24,<2",
    "tiktoken>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".github"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["openagents"]

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # virtual-time tests override the event_loop_policy fixture (tests/virtual_time.py) to run on
    # an autojumping virtual-time loop; pytest-asyncio deprecates the override but offers no per-test
    # alternative that returns a default loop for unmarked tests without erroring.
    "ignore:Overriding the \"event_loop_policy\" fixture is deprecated:Warning",
]
addopts = [
    "--import-mode=importlib",
    "--ignore=examples",
    "-p",
    "tests.concurrency",
]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: fast tests with no external providers (select with --unit)",
    "audio_eot: hermetic audio end-of-turn / turn-detection tests (select with --audio_eot)",
    "plugin(name): OpenAI-compatible endpoint integration test",
    "realtime(name): realtime-model test, optionally for provider `name` (--realtime [name])",
    "stt(name): speech-to-text test, optionally for provider `name` (--stt [name])",
    "tts(name): text-to-speech test, optionally for provider `name` (--tts [name])",
]


[tool.mypy]
strict = true
disallow_any_generics = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openagents.plugins"
follow_untyped_imports = true
