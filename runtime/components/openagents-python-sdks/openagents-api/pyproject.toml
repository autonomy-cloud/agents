[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openagents-api"
dynamic = ["version"]
description = "OpenAgents Python server API"
readme = "README.md"
requires-python = ">=3.9.0"
license = "Apache-2.0"
keywords = ["webrtc", "realtime", "audio", "video"]
authors = [{ name = "OpenAgents contributors" }]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "pyjwt>=2.0.0",
    "aiohttp>=3.9.0",
    "protobuf>=4",
    "types-protobuf>=4",
    "openagents-protocol>=1.1.21,<2.0.0",
]

[project.urls]
Source = "https://github.com/autonomy-cloud/agents"

[tool.uv.sources]
openagents-protocol = { workspace = true }

[tool.hatch.version]
path = "openagents/api/version.py"

[tool.hatch.build.targets.wheel]
packages = ["openagents"]

[tool.hatch.build.targets.sdist]
include = ["/openagents"]
