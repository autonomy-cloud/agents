[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openagents-runtime"
version = "0.1.0"
description = "Air-gapped realtime agent runtime with embedded OpenAgents transport"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
dependencies = [
    "openagents-core>=1.6.9",
    "openagents-plugin-openai>=1.6.9",
    "openagents-plugin-silero>=1.6.9",
]

[project.scripts]
openagents = "openagents.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["openagents"]

[tool.hatch.build.targets.wheel.force-include]
"openagents/bin/openagents-server" = "openagents/bin/openagents-server"
