[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openagents-protocol"
dynamic = ["version"]
description = "OpenAgents Python protocol stubs"
requires-python = ">=3.9.0"
license = "Apache-2.0"
readme = { content-type = "text/plain", text = "OpenAgents Python protocol stubs" }
keywords = ["webrtc", "realtime", "audio", "video"]
authors = [{ name = "OpenAgents contributors" }]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "protobuf>=5",
    "types-protobuf>=5",
]

[project.urls]
Source = "https://github.com/autonomy-cloud/agents"

[tool.hatch.version]
path = "openagents/protocol/version.py"

[tool.hatch.build.targets.wheel]
packages = ["openagents"]

[tool.hatch.build.targets.sdist]
include = ["/openagents"]
